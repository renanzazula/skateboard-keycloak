# Login theme message overrides (English). Everything not listed here falls
# through to the keycloak.v2 parent theme.
#
# Temporary account lockout (brute-force detection, see docs/account-lockout.md).
# Keycloak's stock text for this state is the generic "Invalid username or
# password." (it hides the locked state to prevent user enumeration). The
# ticket requires an explicit lockout message with a retry hint, so we
# override it for the hosted login page.
#
# The unlock time is fixed at 15 minutes (realm waitIncrementSeconds /
# maxFailureWaitSeconds = 900). Keep this copy in sync if those change.
# Keycloak does not expose the exact unlock time to the theme, so the hint
# is a duration rather than a clock time.
accountTemporarilyDisabledMessage=Your account is temporarily locked because of too many failed login attempts. Please try again in 15 minutes.
