# Custom login theme matching the app's login screen (see the FE repo's
# LoginScreen.tsx / BrandedBackground.tsx and shared/constants/themes.ts).
# Extends keycloak.v2, so every hosted page (login, forgot password, update
# password, OTP, ...) inherits the standard markup and only the styling and
# branding change.
parent=keycloak.v2

# The app's brand is dark-only: pin PatternFly's dark theme class instead of
# following the device color scheme, and disable the auto-toggle script.
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark

# css/styles.css resolves from the parent theme; ours layers on top.
styles=css/styles.css css/standard-base.css
